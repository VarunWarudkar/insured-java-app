name: CI + Trigger Jenkins CD

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest
    #defaults:
    #  run: |
    #    cd /home/runner/work/insured-java-app/insured-java-app

    steps:
      - name: Debug working directory
        run: |
          cd /home/runner/work/insured-java-app/insured-java-app
          echo "PWD: $(pwd)"
          ls -la    
          
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Build WAR
        run: mvn clean package

      - name: Upload WAR as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: war-artifact
          path: insured-java-app/target/*.war   
          
      - name: Show WAR file path
        run: find . -name "*.war"

  sonar:
    needs: build
    runs-on: ubuntu-latest
    #defaults:
    #  run:
    #    working-directory: insured-java-app
  
    steps:
      - name: Debug working directory
        run: |
          cd /home/runner/work/insured-java-app/insured-java-app
          echo "PWD: $(pwd)"
          ls -la    
      - name: Checkout repository
        uses: actions/checkout@v4
  
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven
  
      - name: Run Tests
        run: mvn verify jacoco:report

      - name: Run SonarQube Scanner
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "https://sonarcloud.io"
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=varun-sonar_insured-java-app \
            -Dsonar.organization=varun-sonar \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.login=$SONAR_TOKEN

  deploy:
    needs: build
    runs-on: ubuntu-latest
        
    env:
      #JENKINS_URL: http://3.111.48.131:8080
      #TOMCAT_URL: http://3.111.48.131:8000
      JENKINS_URL: ${{ secrets.JENKINS_URL }}
      TOMCAT_URL: ${{ secrets.JENKINS_USER }}
      JENKINS_USER: ${{ secrets.TOMCAT_URL }}
      JENKINS_TOKEN: ${{ secrets.JENKINS_TOKEN }}
      JOB_TOKEN: ${{secrets.JOB_TOKEN}}

    
    steps:
      - name: Trigger Jenkins Job
        run: |
          curl -X POST "http://3.111.48.131:8080/buildByToken/build?job=Deploy-Tomcat-App&token=JOB_TOKEN"
          #curl -X POST "$JENKINS_URL/job/Deploy-Tomcat-App/buildWithParameters?token=$JOB_TOKEN" \
          #      --user $JENKINS_USER:$JENKINS_TOKEN \
          #      --data-urlencode "WAR_PATH=target/hello-tomcat-1.0-SNAPSHOT.war"\
          #      --data-urlencode "TOMCAT_URL=$TOMCAT_URL"
          #      --data-urlencode WAR_URL="https://github.com/VarunWarudkar/insured-java-app/releases/download/latest/*.war" \
          #      --data-urlencode WAR_NAME="*.war"
          #curl -X POST "$JENKINS_URL/job/Deploy-Tomcat-App/build?token=$JOB_TOKEN"\
          #  --user $JENKINS_USER:$JENKINS_TOKEN \  
      - name: Check deployment status (optional)
        run: |
          echo "Waiting for deployment to complete..."
          sleep 30
          curl -I "http://3.111.48.131:8000/Deploy-Tomcat-App"
